[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sunsim"
version = "1.0.0"
description = "Photometric and spectroscopic variability of the Sun and stars from spots, faculae and transiting planets (light curves, spectra, CCFs, RV, FWHM, BIS)"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Sophie Stucki", email = "stucki@ieec.cat" },
    { name = "David Baroch" },
    { name = "Jordi Blanco Pozo" },
    { name = "Òscar Porqueras" },
]
dependencies = [
    "numpy>=1.22",
    "numba>=0.56",
    "scipy>=1.8",
    "astropy>=5.0",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
maps = ["pandas>=1.3"]                  # fast reading of 2D maps saved as text files
plots = ["cmasher>=1.6"]                # cmasher colormaps in sunsim.plot_utils
sdo = ["sunpy>=5.0", "drms>=0.6"]                # SDO/HMI maps of spots and faculae (sunsim.sdo)
all = ["pandas>=1.3", "cmasher>=1.6", "sunpy>=5.0", "drms>=0.6"]

[project.scripts]
sunsim-sdo-maps = "sunsim.sdo:main"     # SDO/HMI images -> spot and facula maps (python -m sunsim.sdo)

[tool.setuptools]
packages = ["sunsim"]

[tool.setuptools.package-data]
sunsim = ["data/instruments/*"]
