# Paths of the data and codes that are not part of SunSim, on this computer.
# Copy this file to local_paths.ini (not tracked by git) and fill in the paths you have; leave the others empty.
# Every key can also be given by an environment variable SUNSIM_<KEY> (e.g. SUNSIM_PHOENIX_MODELS=/data/phoenix).
# Paths can start with ~ and can be relative to this file. The keys are described in sunsim/local_paths.py (KEYS).
[paths]
# Phoenix models: folder with the subfolders Phoenix_mu (SPECINT) and Phoenix (HiRes + WAVE_PHOENIX-ACES-AGSS-COND-2011.fits)
phoenix_models =
# MURaM (MPS-ATLAS) spectra: high resolution, low resolution (cleaned), and the spectra used for the spots
muram_spectra =
muram_lowres_spectra =
muram_spot_spectra =
# CCF masks (HARPS_G20_mps_friendly.mas, ...)
ccf_masks =
# 2D maps of spots and faculae (spot_map_<t>.txt, faculae_map_<t>.txt), e.g. the SDO maps of 2015-2016
# SDO/HMI images (continuum + magnetogram) for sunsim.sdo
sdo_data =
sdo_maps =
# observations of the Sun for sunsim.observations (comparison with the SDO simulations)
harpsn_sun =
# previous SDO identification (identification_utils.py), for analysis/sdo_old_classification.py
old_sdo_identification =
ref_rv_10_years =
ref_days_10_years =
